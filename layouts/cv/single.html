{{ define "main" }}
  <article class="cv-page about-page">
    <header class="cv-header">
      <div class="cv-header-photo">
        {{ with resources.Get "images/me.png" }}
          <img src="{{ .RelPermalink }}" alt="{{ site.Title }}">
        {{ end }}
      </div>
      <div class="cv-header-info">
        <h1 class="cv-name">{{ site.Title }}</h1>
        {{ with .Params.subtitle }}<p class="cv-title">{{ . }}</p>{{ end }}
        <div class="cv-contact">
          <a href="mailto:contact@anashamidi.com">contact@anashamidi.com</a>
          <a href="https://www.linkedin.com/in/anas-hmaidy/" target="_blank" rel="noopener">LinkedIn</a>
          <a href="https://hackerone.com/albetisi" target="_blank" rel="noopener">HackerOne</a>
        </div>
        <a class="cv-download" href="/Anas-Hamidi-CV.pdf" download>&#8681; Download CV (PDF)</a>
      </div>
    </header>
    <div class="about-content-full cv-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
