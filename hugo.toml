# =============================================================================
# Example: Single content folder, single language
# Content: content/posts/post.md (all content in one folder, no translations)
# See: https://gohugo.io/content-management/multilingual/
# =============================================================================

baseURL = 'https://anashamidi.com/'
# Fills the header logo (the empty slot on the left of the nav), the <title>
# on every page, og:site_name, and the RSS channel title. Without it the
# homepage tab was blank and inner tabs read "Posts | ".
title = 'Anas Hamidi'
theme = "mana"
defaultContentLanguage = "en"

[pagination]
  pageSize = 10

[markup]
  [markup.tableOfContents]
    # startLevel must be 2: posts have no H1 in the body (the title is separate),
    # so startLevel=1 wrapped every H2 in a phantom <li> and made them all render
    # with the nested "sub-item" styling.
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  # RSS must be listed explicitly: setting `home` at all replaces Hugo's default
  # ["HTML", "RSS"], which silently dropped the site's main feed (/index.xml).
  home = ["HTML", "JSON", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  description = "Personal blog on offensive security: Bug Bounty, Penetration Test, write-ups, tooling notes, and curated cyber news."
  author = "Anas Hamidi"
  heroTitleLine1 = "Anas Hamidi"
  heroTitleLine2 = "Application Security & Penetration Testing"
  footerText = "Built with Hugo and Mana theme"

  # Byline shown above every post (layouts/partials/author-card.html).
  [params.authorBio]
    tagline = "Penetration Tester · AppSec | Bug Bounty Hunter | M.Sc. Information Systems @ JMU Würzburg"

  [params.social]
    linkedin = "https://www.linkedin.com/in/anas-hmaidy/"
    twitter = "anasbetis023"
    youtube = "https://www.youtube.com/@anashamidii"
    medium = "https://anasbetis023.medium.com/"
    telegram = "https://t.me/anas_hmaidy"
    email = "contact@anashamidi.com"

  [params.buyMeACoffee]
    enabled = false
    id = "anshmaidy2k"
    message = ""
    color = "#FF3B3B"
    position = "Right"
    x_margin = 18
    y_margin = 18

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2025
    owner = "Anas Hamidi"

  [params.admonitions]
    alertStyle = "favicon"

# Single language: use root-level menus. No [languages] block needed.
[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Posts"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 30

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 60

# NOTE: do not set a top-level `url` here. The about/home layouts resolve
# `avatar.<page>.url | default avatar.url` BEFORE falling back to assetPath,
# so a top-level url silently overrides these assetPaths.
[params.avatar.home]
  assetPath = "images/me.jpg"
[params.avatar.about]
  assetPath = "images/me.jpg"

# Social-proof strip under the hero description. Numbers come from the CV.
[[params.heroStats]]
  value = "50+"
  label = "Reports"
[[params.heroStats]]
  value = "#1"
  label = "Hall of Fame"
[[params.heroStats]]
  value = "3+"
  label = "Years"
[[params.heroStats]]
  value = "B2"
  label = "German"

# "Latest video" card on the home page.
[params.youtube]
  channel = "https://www.youtube.com/@anashamidii"
  latestTitle = "Dorking for Bug Bounty — Recon with Search Engines (EP 01)"
  latestId = "8Qdxsi_jSKo"

[[menus.main]]
  name = "CV"
  url = "/cv/"
  weight = 45

[[menus.main]]
  name = "YouTube"
  url = "/youtube/"
  weight = 50
