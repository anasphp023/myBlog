# =============================================================================
# Example: Single content folder, single language
# Content: content/posts/post.md (all content in one folder, no translations)
# See: https://gohugo.io/content-management/multilingual/
# =============================================================================

baseURL = 'https://anashamidi.com/'
# Fills the header logo (the empty slot on the left of the nav), the <title>
# on every page, og:site_name, and the RSS channel title. Without it the
# homepage tab was blank and inner tabs read "Posts | ".
title = 'Anas Hamidi'
theme = "mana"
defaultContentLanguage = "en"
# English stays at the site root, German lives under /de/.
defaultContentLanguageInSubdir = false

[pagination]
  pageSize = 10

[markup]
  [markup.tableOfContents]
    # startLevel must be 2: posts have no H1 in the body (the title is separate),
    # so startLevel=1 wrapped every H2 in a phantom <li> and made them all render
    # with the nested "sub-item" styling.
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  # RSS must be listed explicitly: setting `home` at all replaces Hugo's default
  # ["HTML", "RSS"], which silently dropped the site's main feed (/index.xml).
  home = ["HTML", "JSON", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  description = "Personal blog on offensive security: Bug Bounty, Penetration Test, write-ups, tooling notes, and curated cyber news."
  author = "Anas Hamidi"
  heroTitleLine1 = "Anas Hamidi"
  heroTitleLine2 = "Application Security & Penetration Testing"
  footerText = "Built with Hugo and Mana theme"
  # Fallback social preview image for pages with no cover of their own (home,
  # About, CV, tags); without it those pages shared with no image at all.
  # Must stay above every [params.*] sub-table: a TOML key written after one
  # belongs to that sub-table, not to [params].
  ogImage = "images/og-image.png"

  # Byline shown above every post (layouts/partials/author-card.html).
  [params.authorBio]
    tagline = "Penetration Tester · AppSec | Bug Bounty Hunter | M.Sc. Information Systems @ JMU Würzburg"

  [params.social]
    linkedin = "https://www.linkedin.com/in/anas-hmaidy/"
    hackerone = "https://hackerone.com/albetisi"
    bugcrowd = "https://bugcrowd.com/h/Betisi94"
    twitter = "anasbetis023"
    youtube = "https://www.youtube.com/@anashamidii"
    medium = "https://anasbetis023.medium.com/"
    telegram = "https://t.me/anas_hmaidy"
    email = "contact@anashamidi.com"

  [params.buyMeACoffee]
    enabled = false
    id = "anshmaidy2k"
    message = ""
    color = "#FF3B3B"
    position = "Right"
    x_margin = 18
    y_margin = 18

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2025
    owner = "Anas Hamidi"

  [params.admonitions]
    alertStyle = "favicon"

# NOTE: do not set a top-level `url` here. The about/home layouts resolve
# `avatar.<page>.url | default avatar.url` BEFORE falling back to assetPath,
# so a top-level url silently overrides these assetPaths.
[params.avatar.home]
  assetPath = "images/me.jpg"
[params.avatar.about]
  assetPath = "images/me.jpg"


# "Latest video" card on the home page.
[params.youtube]
  channel = "https://www.youtube.com/@anashamidii"
  latestTitle = "Dorking for Bug Bounty — Recon with Search Engines (EP 01)"
  latestId = "8Qdxsi_jSKo"

# =============================================================================
# Languages. English is the full site; German covers the recruiter-facing
# pages (home, About, CV, YouTube, legal). Posts stay English on purpose --
# the language switcher only shows on pages that actually have a translation,
# so nobody lands on an empty German blog.
# =============================================================================
[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 1
    title = "Anas Hamidi"
    [languages.en.params]
      description = "Personal blog on offensive security: Bug Bounty, Penetration Test, write-ups, tooling notes, and curated cyber news."
      heroTitleLine1 = "Anas Hamidi"
      heroTitleLine2 = "Application Security & Penetration Testing"
      [[languages.en.params.heroStats]]
        value = "50+"
        label = "Reports"
      [[languages.en.params.heroStats]]
        value = "#1"
        label = "Hall of Fame"
      [[languages.en.params.heroStats]]
        value = "3+"
        label = "Years"
      [[languages.en.params.heroStats]]
        value = "B2"
        label = "German"
  [[languages.en.menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[languages.en.menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20
  [[languages.en.menus.main]]
    name = "About"
    url = "/about/"
    weight = 30
  [[languages.en.menus.main]]
    name = "CV"
    url = "/cv/"
    weight = 45
  [[languages.en.menus.main]]
    name = "YouTube"
    url = "/youtube/"
    weight = 50
  [[languages.en.menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 60

  [languages.de]
    languageName = "Deutsch"
    languageCode = "de"
    weight = 2
    title = "Anas Hamidi"
    [languages.de.params]
      description = "Blog über Offensive Security: Bug Bounty, Penetration Testing, Write-ups, Tooling-Notizen und ausgewählte Security-News."
      heroTitleLine1 = "Anas Hamidi"
      heroTitleLine2 = "Application Security & Penetration Testing"
      [[languages.de.params.heroStats]]
        value = "50+"
        label = "Reports"
      [[languages.de.params.heroStats]]
        value = "#1"
        label = "Hall of Fame"
      [[languages.de.params.heroStats]]
        value = "3+"
        label = "Jahre"
      [[languages.de.params.heroStats]]
        value = "B2"
        label = "Deutsch"
  [[languages.de.menus.main]]
    name = "Start"
    pageRef = "/"
    weight = 10
  [[languages.de.menus.main]]
    name = "Beiträge"
    pageRef = "/posts"
    weight = 20
  [[languages.de.menus.main]]
    name = "Über mich"
    url = "/de/about/"
    weight = 30
